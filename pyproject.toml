[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus"
version = "0.1.0"
description = "Self-hosted home infrastructure agent with chat and optional policy-gated MCP interfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anatolii Stehnii", email = "tsdaemon@gmail.com" }]
dependencies = [
    "ag-ui-langgraph>=0.0.45",
    "ag-ui-protocol>=0.1.22",
    "alembic>=1.20.0",
    "sqlalchemy>=2.0",
    "arize-phoenix-otel>=0.17.1",
    "deepagents>=0.7.14",
    "docker>=7",
    "fastapi>=0.141.1",
    "fastmcp>=2.0",
    "langchain-core>=1.6.3",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "openinference-instrumentation-langchain>=0.1.76",
    "opentelemetry-exporter-otlp>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2",
    "pyyaml>=6",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/tsdaemon/argus"

[project.scripts]
# Deployed on the host that runs escalated sessions, wired up as a forced SSH command —
# not run by the server. See the README's break-glass section.
argus-breakglass-launch = "argus.host_launch:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3",
    "ruff>=0.6",
    "watchfiles>=1.0",  # makes uvicorn --reload event-driven
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
