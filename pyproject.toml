[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argus-mcp"
version = "0.1.0"
description = "Pluggable, policy-gated MCP server for operating home infrastructure without handing an agent raw shell access."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Anatolii Stehnii", email = "tsdaemon@gmail.com" }]
dependencies = [
    "fastmcp>=2.0",
    "pydantic>=2",
    "pyyaml>=6",
    "docker>=7",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.urls]
Homepage = "https://github.com/tsdaemon/argus"

[project.scripts]
argus = "argus.cli:main"
# Deployed on the host that runs escalated sessions, wired up as a forced SSH command —
# not run as part of `argus serve`. See the README's break-glass section.
argus-breakglass-launch = "argus.host_launch:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/argus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
