version: "3"

dotenv: [".env"]

env:
  ARGUS_AGENT_DATABASE_URL: "postgresql://argus:{{.POSTGRES_PASSWORD}}@127.0.0.1:5432/argus"
  ARGUS_CONFIG: examples/argus.dev.yaml

tasks:
  # --- Project workflows ---

  install:
    desc: Install dependencies (incl. dev tools) into a local venv via uv.
    cmds:
      - task: backend:install
      - task: frontend:install

  dev:
    desc: Start dependencies, migrate, and run local Argus + Vite under mprocs.
    preconditions:
      - sh: command -v mprocs
        msg: Install mprocs before running task dev.
    cmds:
      - task: deps:up
      - task: backend:migrate
      - mprocs

  test:
    desc: Run the test suite.
    cmds:
      - task: backend:test
      - task: frontend:test

  lint:
    desc: Lint the project.
    cmds:
      - task: backend:lint

  # --- Dependencies ---

  deps:up:
    desc: Start Postgres, Phoenix, and Docker canaries; run Argus locally with task backend:dev.
    cmds:
      - docker compose --profile test up -d --build --wait

  deps:down:
    desc: Stop the local dependencies and canaries, preserving their data.
    cmds:
      - docker compose --profile test stop

  # --- Backend ---

  backend:install:
    desc: Install the backend dependencies into a local venv via uv.
    cmds:
      - uv sync --extra dev

  backend:dev:
    desc: Run argus locally on 127.0.0.1:8421, reloading on changes (needs deps:up, migrate, and OPENROUTER_API_KEY in .env).
    cmds:
      - uv run uvicorn argus.api.app:create_app --factory --port 8421 --reload --reload-dir src --reload-dir examples --reload-include '*.yaml'

  backend:lint:
    desc: Lint the backend with ruff.
    cmds:
      - uv run ruff check src tests

  backend:test:
    desc: Run the test suite.
    cmds:
      - uv run pytest

  backend:migrate:
    desc: Apply Argus-owned Postgres migrations (threads/runs/messages/tool_calls/approvals).
    cmds:
      - uv run alembic upgrade head

  # --- Frontend ---

  frontend:install:
    desc: Install the pinned CopilotKit/React frontend dependencies (Node 24).
    dir: frontend
    cmds:
      - npm ci

  frontend:dev:
    desc: Run Vite locally; proxies the API to the agent on port 8421.
    dir: frontend
    cmds:
      - npm run dev

  frontend:build:
    desc: Build the web UI served at / by the agent.
    dir: frontend
    cmds:
      - npm run build

  frontend:test:
    desc: Browser integration tests against in-memory stores (requires Playwright Chromium).
    dir: frontend
    cmds:
      - npm test

  # --- Docker ---

  docker:build:
    desc: Build the Argus image.
    cmds:
      - docker build -t argus:local .

  docker:up:
    desc: Run the full Argus stack (agent + Postgres + Phoenix) via docker compose (needs .env — see .env.example).
    cmds:
      - docker compose --profile app up -d --build

  docker:down:
    desc: Stop the docker compose stack.
    cmds:
      - docker compose --profile app down

  docker:logs:
    desc: Follow the argus service's logs.
    cmds:
      - docker compose logs -f argus

  # --- Theseus deployment ---
  # Requires docker-compose.deploy.yml and .env.deploy; copy their .example templates.

  deploy:
    desc: Deploy to theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose --profile app -f docker-compose.yml -f docker-compose.deploy.yml
        up -d --build

  deploy:down:
    desc: Stop Argus on theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose --profile app -f docker-compose.yml -f docker-compose.deploy.yml down

  deploy:logs:
    desc: Follow Argus's logs on theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose --profile app -f docker-compose.yml -f docker-compose.deploy.yml
        logs -f
