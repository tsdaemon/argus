version: "3"

dotenv: [".env"]

tasks:
  install:
    desc: Install dependencies (incl. dev tools) into a local venv via uv.
    cmds:
      - uv sync --extra dev

  test:
    desc: Run the test suite.
    cmds:
      - uv run pytest

  lint:
    desc: Lint with ruff.
    cmds:
      - uv run ruff check src tests

  precommit:install:
    desc: Install the pre-commit git hook (once, per clone).
    cmds:
      - uv run pre-commit install

  precommit:run:
    desc: Run all pre-commit hooks against the whole repo.
    cmds:
      - uv run pre-commit run --all-files

  postgres:up:
    desc: Start just Postgres for local agent dev (needs POSTGRES_PASSWORD in .env).
    cmds:
      - docker compose up -d postgres

  migrate:
    desc: Apply Argus-owned Postgres migrations (threads/runs/messages/tool_calls/approvals).
    env:
      ARGUS_AGENT_DATABASE_URL: "postgresql://argus:{{.POSTGRES_PASSWORD}}@localhost:5432/argus"
    cmds:
      - uv run alembic upgrade head

  agent:serve:
    desc: Run Argus Agent locally (needs postgres:up + migrate first, OPENROUTER_API_KEY in .env).
    cmds:
      - uv run argus agent serve --config examples/argus.example.yaml

  mcp:run:
    desc: Run just the MCP server over stdio, no agent (no network exposure, no token needed).
    cmds:
      - uv run argus serve --config examples/argus.example.yaml --transport stdio

  mcp:serve:
    desc: Run just the MCP server over HTTP, no agent (needs ARGUS_MCP_TOKEN in .env).
    cmds:
      - uv run argus serve --config examples/argus.example.yaml

  breakglass:list:
    desc: List break-glass requests in the local example config's store.
    cmds:
      - uv run argus breakglass list --config examples/argus.example.yaml

  docker:build:
    desc: Build the Argus image.
    cmds:
      - docker build -t argus:local .

  docker:up:
    desc: Run the full Argus stack (agent + Postgres + Phoenix) via docker compose (needs .env — see .env.example).
    cmds:
      - docker compose up -d --build

  docker:down:
    desc: Stop the docker compose stack.
    cmds:
      - docker compose down

  docker:logs:
    desc: Follow the argus service's logs.
    cmds:
      - docker compose logs -f argus

  # --- theseus deployment (see the homelab-compose-deploy skill / README) -----------
  # Needs docker-compose.deploy.yml (gitignored — copy docker-compose.deploy.yml.example)
  # and .env.deploy (gitignored — copy .env.deploy.example) to exist first.

  deploy:
    desc: Deploy to theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml
        up -d --build

  deploy:down:
    desc: Stop Argus on theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml down

  deploy:logs:
    desc: Follow Argus's logs on theseus.
    dotenv: [".env.deploy"]
    cmds:
      - docker --context theseus compose -f docker-compose.yml -f docker-compose.deploy.yml
        logs -f
