services:
  argus:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
      - phoenix
    ports:
      # One process, one port: the UI, /agent (AG-UI), /breakglass, and, if ARGUS_MCP_TOKEN
      # is set, /mcp are all served here — see the README.
      - "${ARGUS_PORT:-8421}:8421"
    environment:
      ARGUS_MCP_TOKEN: ${ARGUS_MCP_TOKEN:-}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      ARGUS_NTFY_TOPIC_URL: ${ARGUS_NTFY_TOPIC_URL:-}
      ARGUS_AGENT_DATABASE_URL: postgresql://argus:${POSTGRES_PASSWORD}@postgres:5432/argus
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    # The host's docker group, which owns the socket below (`stat -c %g /var/run/docker.sock`).
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - ${CONFIG_FILE:-./examples/argus.example.yaml}:/config/argus.yaml:ro
      - argus-agent-workspace:/var/lib/argus/agent-workspace
      # Lets the docker provider talk to your daemon. Scope what it can see via
      # allowed_containers in the mounted config, not via this mount — a read-only
      # bind here would restrict changes to the socket *file*, not calls sent over it.
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - argus-pg-data:/var/lib/postgresql/data
    ports:
      # localhost-only: lets a non-containerized `uvicorn argus.api.app:create_app` (or
      # `alembic upgrade head`) reach this same Postgres for local dev.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Creates Phoenix's database in this Postgres if it is missing. It runs on every start, since
  # Postgres runs init scripts only on an empty volume.
  phoenix-db:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: argus
      PGDATABASE: argus
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    command:
      - sh
      - -c
      - psql -tAc "select 1 from pg_database where datname = 'phoenix'" | grep -q 1 || psql -c "create database phoenix"

  phoenix:
    # Stock Phoenix plus a patch that honours span-reported cost; see phoenix/Dockerfile.
    build: ./phoenix
    image: argus-phoenix:local
    restart: unless-stopped
    depends_on:
      phoenix-db:
        condition: service_completed_successfully
    # Traces, users, and API keys live in the `phoenix` database, so a recreate keeps them.
    environment:
      PHOENIX_POSTGRES_HOST: postgres
      PHOENIX_POSTGRES_USER: argus
      PHOENIX_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PHOENIX_POSTGRES_DB: phoenix
      # Seeds the Default retention policy (pruned weekly) on a new database; change it later
      # in Phoenix's settings.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "45"
    ports:
      - "127.0.0.1:6006:6006"

volumes:
  argus-agent-workspace:
  argus-pg-data:
