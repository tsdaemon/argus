services:
  argus:
    profiles: [app]
    build: .
    restart: unless-stopped
    depends_on:
      - postgres
      - phoenix
    ports:
      # One process, one port: /agent (AG-UI) and, if ARGUS_MCP_TOKEN is set, /mcp +
      # /breakglass are all served here — see the README.
      - "${ARGUS_PORT:-8421}:8421"
    environment:
      ARGUS_MCP_TOKEN: ${ARGUS_MCP_TOKEN:-}
      ARGUS_ADMIN_PASSWORD: ${ARGUS_ADMIN_PASSWORD:-}
      ARGUS_NTFY_TOPIC_URL: ${ARGUS_NTFY_TOPIC_URL:-}
      ARGUS_AGENT_DATABASE_URL: postgresql://argus:${POSTGRES_PASSWORD}@postgres:5432/argus
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - ${CONFIG_FILE:-./examples/argus.example.yaml}:/config/argus.yaml:ro
      - argus-agent-workspace:/var/lib/argus/agent-workspace
      # Lets the docker provider talk to your daemon. Scope what it can see via
      # allowed_containers in the mounted config, not via this mount — a read-only
      # bind here would restrict changes to the socket *file*, not calls sent over it.
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - argus-pg-data:/var/lib/postgresql/data
    ports:
      # localhost-only: lets a non-containerized `uvicorn argus.api.app:create_app` (or
      # `alembic upgrade head`) reach this same Postgres for local dev.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 2s
      timeout: 3s
      retries: 30

  phoenix:
    # Stock Phoenix plus a patch that honours span-reported cost; see phoenix/Dockerfile.
    build: ./phoenix
    image: argus-phoenix:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:6006:6006"

  # Disposable Docker targets: a/b are allowlisted; hidden tests access restrictions.
  # They have no host ports or data and run only with the test profile.
  canary-a:
    profiles: [test]
    image: alpine:3.22
    container_name: argus-live-a
    restart: "no"
    command:
      - /bin/sh
      - -c
      - "trap 'exit 0' TERM INT; while :; do echo argus-live-heartbeat; sleep 5; done"

  canary-b:
    profiles: [test]
    image: alpine:3.22
    container_name: argus-live-b
    restart: "no"
    command:
      - /bin/sh
      - -c
      - "trap 'exit 0' TERM INT; while :; do echo argus-live-heartbeat; sleep 5; done"

  canary-hidden:
    profiles: [test]
    image: alpine:3.22
    container_name: argus-live-hidden
    restart: "no"
    command:
      - /bin/sh
      - -c
      - "trap 'exit 0' TERM INT; while :; do echo argus-live-heartbeat; sleep 5; done"

volumes:
  argus-agent-workspace:
  argus-pg-data:
