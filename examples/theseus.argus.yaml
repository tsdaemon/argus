# A real-shaped Argus config for the "theseus" NAS (https://github.com/tsdaemon/theseus).
# No secrets here — the ntfy topic and break-glass token are supplied via environment
# variables at runtime, not committed. This file is an example of wiring a real
# deployment's config, not something the argus-mcp package itself depends on.

providers:
  docker:
    enabled: true
    socket: unix:///var/run/docker.sock
    # No allowed_containers here: every container on theseus is visible to the agent.
    # Set allowed_containers: [...] (compose service names from theseus's
    # roles/applications/*) to scope this down to a subset instead.

  breakglass:
    enabled: true
    approval_url: https://argus.theseus.internal
    notify:
      type: ntfy
      topic_url: ${ARGUS_NTFY_TOPIC_URL}
    # Hosts are prepared by autohome's `breakglass` role (see docs/breakglass.md): a
    # dedicated user, the launcher script, and a forced-command key. Use the LAN address
    # of each host; the container cannot resolve .local names.
    # launcher:
    #   type: ssh
    #   identity_file: /run/secrets/argus_launcher_key
    #   permission_mode: manual
    #   ttl_seconds: 900
    #   hosts:
    #     theseus:
    #       host: 192.168.0.7
    #       user: argus-bg

policy:
  default_mutate: require_approval
  default_destructive: deny
  overrides:
    # Explicit, matching the design discussion: restarts always prompt, even though
    # that's already the default_mutate behavior — spelled out here so it survives a
    # future change to the default without silently loosening this one.
    docker.restart_container: require_approval
