# Argus runs on your machine; Postgres/Phoenix/Docker canaries run in Compose.
# task backend:dev supplies the local database URL and loads .env.
providers:
  docker:
    enabled: true
    socket: unix:///var/run/docker.sock
    allowed_containers:
      - argus-live-a
      - argus-live-b
  breakglass:
    enabled: true
    approval_url: http://127.0.0.1:8421
    notify:
      type: ntfy
      topic_url: ${ARGUS_NTFY_TOPIC_URL}
    launcher:
      type: ssh
      identity_file: ./.ssh/argus_launcher
      permission_mode: manual
      ttl_seconds: 900
      hosts:
        theseus:
          host: 192.168.0.7
          user: argus-bg

policy:
  default_mutate: require_approval
  default_destructive: deny
  overrides: {}

agent:
  workspace_root: ./.argus/workspace
  database_url: ${ARGUS_AGENT_DATABASE_URL}
  api_key: ${OPENROUTER_API_KEY}
  model_base_url: https://openrouter.ai/api/v1
  model: google/gemini-3.7-flash
  worker_model: stepfun/step-3.7-flash
  otel:
    enabled: true
    endpoint: http://127.0.0.1:6006/v1/traces
